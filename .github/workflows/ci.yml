name: TrialPulse CI Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rag_model:
        description: "Also runs RAG with real model download"
        type: boolean
        default: false
      docker_runtime:
        description: "Build and test the four isolated Docker services"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix backend test
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run test:react
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run lint:strict
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - name: Validate Compose configuration (no secret files)
        run: docker compose --env-file backend/.env.example config --quiet

  python-light:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            data_agent/requirements-runtime.txt
            requirements-dev.txt
      - run: python -m pip install -r data_agent/requirements-runtime.txt -r requirements-dev.txt
      - run: python -m ruff check
      - run: python -m black --check .
      - run: python -m mypy
      - name: Python tests without model or Docker
        run: >-
          python -m pytest tests/unit tests/test_data_agent.py tests/test_data_loader.py
          tests/test_dynamic_agent.py tests/test_pandas_sandbox.py tests/test_validate_kb.py
          tests/test_python_bridge.py
      - run: python scripts/validate_kb.py
      - name: Tests excluded from the lightweight profile
        run: echo "Real RAG and Docker runtime require workflow_dispatch with explicit opt-in. No LLM calls in CI."

  rag-model:
    if: github.event_name == 'workflow_dispatch' && inputs.rag_model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r data_agent/requirements-runtime.txt -r rag/requirements.txt -r requirements-dev.txt
      - name: RAG on temporary indexes with explicit model download
        run: python -m pytest tests/test_rag_documents.py tests/test_rag_api.py tests/test_rag_retrieval.py

  docker-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.docker_runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build images without secrets
        run: docker compose --env-file backend/.env.example build
      - name: Build index in the dedicated QA volume
        run: docker compose --env-file backend/.env.example run --rm --no-deps rag python build_index.py
      - name: Start and check health of all four services
        run: docker compose --env-file backend/.env.example up --wait --wait-timeout 180
      - name: Real retrieval without LLM provider
        run: >-
          curl --fail-with-body --silent --show-error http://127.0.0.1:18001/retrieve
          -H 'Content-Type: application/json'
          -d '{"query":"Quali sono le regole di data completeness?"}'
          | python -c "import json,sys; rows=json.load(sys.stdin)['results']; assert rows; assert all(row['source'].startswith('knowledge_base/') for row in rows)"
      - name: Collect diagnostics on failure
        if: failure()
        run: docker compose --env-file backend/.env.example logs --no-color
      - name: Stop QA containers only
        if: always()
        run: docker compose --env-file backend/.env.example down

  sandbox-isolation:
    if: github.event_name == 'workflow_dispatch' && inputs.docker_runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build isolated image separately from regular services
        run: docker build -f data_agent/sandbox/Dockerfile -t trialpulse-sandbox:ci data_agent
      - name: Set immutable image ID required by executor
        run: docker image inspect --format 'TRIALPULSE_SANDBOX_IMAGE={{.Id}}' trialpulse-sandbox:ci >> "$GITHUB_ENV"
      - name: Test Docker isolation without LLM
        run: python -m pytest tests/test_pandas_docker.py

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["data_agent", "."]

[tool.coverage.run]
branch = true
source = ["data_agent"]

[tool.coverage.report]
show_missing = true
include = ["data_agent/analytics.py", "data_agent/data_loader.py", "data_agent/analysis_cache.py", "data_agent/result_cache.py"]

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["data_agent/result_cache.py", "data_agent/analysis_cache.py", "tests/unit/*.py", "scripts/benchmark_data.py", "scripts/dev.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 100
target-version = ["py314"]
include = '(result_cache|analysis_cache|benchmark_data|dev|conftest|test_data_unit|test_data_cache|test_result_cache|test_dev_launcher)\.py$'
force-exclude = '(\.venv|node_modules|chroma_db|generated_charts|data_agent/config|data_agent/notebooks)/'

[tool.mypy]
python_version = "3.14"
files = ["data_agent/result_cache.py", "data_agent/data_loader.py"]
mypy_path = "data_agent"
strict = true

# pandas non distribuisce stub: il controllo del loader non verifica le operazioni DataFrame.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
